<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>You're invited · Closer</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <header><a href="/">💞 Closer</a></header>
  <h1>Someone wants to be Closer with you</h1>
  <p class="muted">If Closer is installed, this link opens the app. If not, install it and enter this code:</p>
  <div class="card"><div class="code" id="code">——————</div></div>
  <p><a class="button" id="play" href="https://play.google.com/store/apps/details?id=app.closer.widget">Get Closer on Google Play</a></p>
  <p class="muted">Codes expire after 48 hours.</p>
  <footer><a href="/privacy">Privacy</a><a href="/terms">Terms</a></footer>
</main>
<script>
  (function () {
    var parts = location.pathname.split('/').filter(Boolean);
    var code = (parts[0] === 'i' && parts[1] ? parts[1] : '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
    if (code) {
      document.getElementById('code').textContent = code;
      // Pass the code through the Play install referrer so the app can pre-fill it.
      var play = document.getElementById('play');
      play.href = 'https://play.google.com/store/apps/details?id=app.closer.widget&referrer=' +
        encodeURIComponent('invite=' + code);
    }
  })();
</script>
</body>
</html>
